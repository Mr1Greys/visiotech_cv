openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead form submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit lead form
      description: Accepts a landing-page lead and forwards it to Telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadRequest"
      responses:
        "200":
          description: Lead delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadResponse"
        "400":
          description: Invalid payload
        "502":
          description: Telegram delivery failed
        "503":
          description: Telegram is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadRequest:
      type: object
      properties:
        name:
          type: string
        company:
          type: string
        task:
          type: string
        city:
          type: string
        locations:
          type: string
        email:
          type: string
          format: email
        contact:
          type: string
      required:
        - name
        - company
        - task
        - email
    LeadResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

