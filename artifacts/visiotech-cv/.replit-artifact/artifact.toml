kind = "web"
previewPath = "/"
title = "visiotech_cv — видеоаналитика для HoReCa"
description = "Премиальный одностраничный сайт сервиса видеоаналитики для HoReCa: подсчёт готовой продукции по существующим камерам, проверка разрыва с кассой и заявка на бесплатную оценку камеры."
version = "1.0.0"
id = "artifacts/visiotech-cv"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21149

[services.development]
run = "pnpm --filter @workspace/visiotech-cv run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/visiotech-cv", "run", "build" ]
serve = "static"
publicDir = "artifacts/visiotech-cv/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21149"
BASE_PATH = "/"
